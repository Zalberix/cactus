port: 4222
http_port: 8222

tls: {
  cert_file: "/etc/nats/certs/server.pem"
  key_file: "/etc/nats/certs/server-key.pem"
  ca_file: "/etc/nats/certs/ca.pem"
  min_version: "1.2"
}

jetstream {
  store_dir: /data/jetstream
  max_memory_store: 1GB
  max_file_store: 10GB
}

operator: "/etc/nats/jwt/operator.jwt"

resolver: {
  type: full
  dir: "/data/jwt"
  allow_delete: true
  interval: "2m"
  limit: 1000
}
