services:
  telegram-bot:
    build:
      context: .
      dockerfile: docker/local/telegram-bot.Dockerfile
  #    restart: unless-stopped
    restart: always
    ports:
      - "8008:80"
    environment:
      - SERVICE_PORT=80
    volumes:
      - ./apps/telegram-bot/cmd/telegram-bot/subscriptions.db:/src/apps/telegram-bot/cmd/telegram-bot/subscriptions.db
    env_file:
      - ./apps/telegram-bot/cmd/telegram-bot/.env

  temporal:
    image: temporalio/auto-setup:1.22.2
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      - DB=postgresql
      - DB_PORT=5432
      # this is db addr
      - POSTGRES_SEEDS=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=twir
      - POSTGRES_PWD=twir
      - POSTGRES_DB=temporal
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    volumes:
      - ./configs/temporal:/etc/temporal/config/dynamicconfig
    networks:
      - twir-dev
    ports:
      - "7233:7233"
    labels:
      kompose.volume.type: configMap

  temporal-admin-tools:
    image: temporalio/admin-tools:1.3.2
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    networks:
      - cactus-dev
    stdin_open: true
    tty: true

  temporal-ui:
    image: temporalio/ui:2.45.4
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    networks:
      - cactus-dev
    ports:
      - "7234:8080"

  db:
    image: postgres:17.1
    restart: always
    volumes:
      - ./assets/pgsql-cactus-volume:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    # networks:
    #   - pgsql-cactus-network
    environment:
      POSTGRES_DB: "cactus"
      POSTGRES_USER: "root"
      POSTGRES_PASSWORD: "root"
    command: -p 5432
    networks:
      - cactus-dev

  nats:
    image: nats:2.12.4-scratch
    command: -js -m 8222
    restart: unless-stopped
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - cactus-dev

  redis:
    hostname: redis
    image: redis:8.4.2-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      - REDIS_USER=root
      - REDIS_PASSWORD=root
      - REDIS_PORT=6379
      - REDIS_DATABASES=16
    volumes:
      - ./assets/redis-cactus-volume:/data
    networks:
      - cactus-dev

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MH_STORAGE: "memory"
    networks:
      - cactus-dev

networks:
  cactus-dev:
    driver: bridge

# networks:
#   pgsql-cactus-network:
#     driver: bridge