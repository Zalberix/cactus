version: "3.7"

services:
  telegram-bot:
    build:
      context: .
      dockerfile: ./docker/telegram-bot.Dockerfile
  #    restart: unless-stopped
    restart: always
    ports:
      - "8008:80"
    environment:
      - SERVICE_PORT=80
    volumes:
      - ./cmd/redis-cactus-volume:/data
    env_file:
      - ./cmd/telegram-bot/.env

  pgsql:
    image: postgres:15.1
    restart: always
    volumes:
      - ./assets/pgsql-cactus-volume:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    # networks:
    #   - pgsql-cactus-network
    environment:
      POSTGRES_DB: "cactus"
      POSTGRES_USER: "root"
      POSTGRES_PASSWORD: "root"
    command: -p 5432
  
  redis:
    image: redis:7.4.1-alpine
    restart: always
    ports:
      - "6379:6379"
    environment:
      - REDIS_USER=root
      - REDIS_PASSWORD=root
      - REDIS_PORT=6379
      - REDIS_DATABASES=16
    volumes:
      - ./assets/redis-cactus-volume:/data

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    ports:
      - "1025:1025"
      - "8025:8025" # UI
    environment:
      MH_STORAGE: "memory"
    restart: unless-stopped

# networks:
#   pgsql-cactus-network:
#     driver: bridge