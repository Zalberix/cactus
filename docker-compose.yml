name: cactus

services:
  api:
    build:
      context: .
      dockerfile: docker/local/air.Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      # Override config with docker-specific values (service names instead of localhost)
      - ./config/docker/cactus.yaml:/app/config/local/cactus.yaml
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cactus-net

  web:
    build:
      context: ./web/cactus
      dockerfile: ../../docker/local/web.Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./web/cactus:/app
      # Named volume keeps node_modules from being overwritten by host mount
      - web-node-modules:/app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - api
    networks:
      - cactus-net

  db:
    image: postgres:15.1
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "postgres"
      POSTGRES_USER: "root"
      POSTGRES_PASSWORD: "root"
    volumes:
      - ./assets/pgsql-cactus-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cactus-net

  redis:
    image: redis:8.0.3-alpine
    hostname: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass root
    volumes:
      - ./assets/redis-cactus-volume:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "root", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cactus-net

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MH_STORAGE: "memory"
    networks:
      - cactus-net

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: s3admin
      RUSTFS_SECRET_KEY: s3admin
    volumes:
      - ./assets/rustfs-data:/data
    networks:
      - cactus-net

volumes:
  go-mod-cache:
  go-build-cache:
  web-node-modules:

networks:
  cactus-net:
    driver: bridge
    name: cactus-net
