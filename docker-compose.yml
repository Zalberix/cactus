name: cactus

services:
  temporal:
    image: temporalio/auto-setup:1.22.2
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      - DB=postgresql
      - DB_PORT=5432
      # this is db addr
      - POSTGRES_SEEDS=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=root
      - POSTGRES_PWD=root
      - POSTGRES_DB=temporal
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    volumes:
      - ./configs/temporal:/etc/temporal/config/dynamicconfig
    networks:
      - cactus-net
    ports:
      - "7233:7233"
    labels:
      kompose.volume.type: configMap

  temporal-admin-tools:
    image: temporalio/admin-tools:1.3.2
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    networks:
      - cactus-net
    stdin_open: true
    tty: true

  temporal-ui:
    image: temporalio/ui:2.45.4
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    networks:
      - cactus-net
    ports:
      - "7234:8080"

  postgres:
    image: postgres:17.1
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "postgres"
      POSTGRES_USER: "root"
      POSTGRES_PASSWORD: "root"
    volumes:
      - ./docker/assets/postgres:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    networks:
      - cactus-net

  nats:
    image: nats:2.12.4-scratch
    command: -js -m 8222 --config /etc/nats/nats.conf
    restart: unless-stopped
    volumes:
      - ./configs/nats.conf:/etc/nats/nats.conf:ro
      - ./configs/nats/certs:/etc/nats/certs:ro
      - ./configs/nats/jwt:/etc/nats/jwt:ro
      - ./docker/assets/nats:/data
      - ./docker/assets/nats-jwt:/data/jwt
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - cactus-net

  nui:
    image: ghcr.io/nats-nui/nui
    ports:
      - "31311:31311"
    volumes:
      - ./docker/assets/nui:/db
    networks:
      - cactus-net
    depends_on:
      - nats

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MH_STORAGE: "memory"
    networks:
      - cactus-net

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: s3admin
      RUSTFS_SECRET_KEY: s3admin
    volumes:
      - ./docker/assets/rustfs:/data
    networks:
      - cactus-net

volumes:
  go-mod-cache:
  go-build-cache:
  web-node-modules:

networks:
  cactus-net:
    driver: bridge
    name: cactus-net
